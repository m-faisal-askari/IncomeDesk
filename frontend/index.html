<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/IncomeDesk_Icon_Transparent.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="IncomeDesk is a financial workspace for independent professionals." />
    <title>IncomeDesk | Financial Workspace</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('incomedesk-theme');
        const theme = savedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const favicon = document.querySelector('link[rel="icon"]');
        if (favicon) {
          favicon.href = theme === 'light' ? '/IncomeDesk_Icon_Light.svg' : '/IncomeDesk_Icon_Transparent.svg';
        }
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
